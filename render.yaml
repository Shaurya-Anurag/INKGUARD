services:
  - type: web
    name: inkguard-api
    runtime: python
    branch: frontend-dev
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: INKGUARD_STORAGE
        value: /tmp/inkguard-uploads
      - key: MAX_UPLOAD_MB
        value: 15
      # Set DATABASE_URL and CORS_ORIGINS in the Render Dashboard.
